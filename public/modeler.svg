<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0d0d10"/>
  
  <!-- 3D Cube representation -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Back face -->
    <path d="M-60 -80 L60 -80 L60 40 L-60 40 Z" fill="#0d9488" opacity="0.5" transform="translate(30, -30)"/>
    
    <!-- Right face -->
    <path d="M60 -80 L90 -50 L90 70 L60 40 Z" fill="#0f766e" transform="translate(0, 0)"/>
    
    <!-- Top face -->
    <path d="M-60 -80 L-30 -110 L90 -50 L60 -80 Z" fill="#14b8a6" transform="translate(0, 0)"/>
    
    <!-- Front face -->
    <path d="M-60 -80 L60 -80 L60 40 L-60 40 Z" fill="url(#gradient)" transform="translate(0, 0)"/>
    
    <!-- M letter -->
    <text x="0" y="10" font-family="JetBrains Mono, monospace" font-size="80" font-weight="700" fill="white" text-anchor="middle">M</text>
  </g>
  
  <!-- Accent dots -->
  <circle cx="440" cy="72" r="8" fill="#14b8a6" opacity="0.8"/>
  <circle cx="72" cy="440" r="6" fill="#14b8a6" opacity="0.6"/>
</svg>

